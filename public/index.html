<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e9"><title>Broadcast Storm | 全班即時互動</title><link rel="stylesheet" href="/styles.css"></head><body><header><span class="brand">◈ NETWORK LAB</span><span class="tag">LIVE CLASSROOM · 互動實驗</span></header><main class="landing"><div class="eyebrow">企業電腦網路｜Layer 2</div><h1>Broadcast<br><em>Storm.</em></h1><p class="lead">全班一起發出廣播封包，看看交換器迴圈如何影響網路。<br>用 STP 阻止風暴，找出真正的解方。</p><div class="entry"><button class="primary" id="create">我是主持人 · 建立教室 ↗</button><div class="joinrow"><input id="room" placeholder="輸入 6 位教室代碼" maxlength="6" autocomplete="off"><button class="secondary" id="join">加入教室 →</button></div></div><p class="note">教學模擬：封包數量與流量為模型計算，並非真實網路封包或實測值。</p></main><footer>Maillard Minimal · Broadcast Storm Simulation</footer><script src="/common.js"></script><script>document.querySelector('#create').onclick=async()=>{try{const d=await api('/api/create',{});location.href='/host.html?room='+d.room+'&key='+d.secret}catch(e){alert(e.message)}};document.querySelector('#join').onclick=()=>{let x=document.querySelector('#room').value.trim().toUpperCase();if(x.length!==6){alert('請輸入 6 位教室代碼');return}location.href='/play.html?room='+encodeURIComponent(x)};document.querySelector('#room').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#join').click()};</script></body></html>
