<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生互動 | Broadcast Storm</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">◈ NETWORK LAB</a><span class="tag">STUDENT MODE</span></header><main class="player"><div class="eyebrow">即時網路互動 · ROOM <span id="room">------</span></div><h1 class="smalltitle">Send a <em>Broadcast.</em></h1><div class="card" id="registration"><h2>加入網路實驗</h2><p class="sub">輸入暱稱，讓你的廣播事件出現在全班大螢幕。</p><input id="name" placeholder="你的暱稱（例如：PC-01）" maxlength="20" autocomplete="nickname"><button class="primary full" id="start">加入教室 →</button></div><div id="game" hidden><div class="card device"><div class="devicehead"><div class="icon">▣</div><div><small>YOUR DEVICE</small><h2 id="username">PC</h2></div><span class="connected">● CONNECTED</span></div><p>按下按鈕，讓你的裝置送出一個 ARP Request（教學模擬）。</p><button class="sendbtn" id="send">📡 發送廣播封包</button><p id="result" class="result">等待發送……</p></div><div class="card mini"><div class="cardtitle">CLASS NETWORK STATUS <span class="minor">即時更新</span></div><strong id="status" class="statuspill ok">NORMAL · 正常</strong><div class="minirow"><span>同學數</span><strong id="players">0</strong></div><div class="minirow"><span>廣播事件</span><strong id="broadcasts">0</strong></div><div class="minirow"><span>模擬負載</span><strong id="active">0</strong></div><p class="fine" id="explain">由主持人控制 Loop 與 STP。</p></div></div><p class="note">⚠ 這是教學模擬，不會真的向區域網路廣播封包。</p></main><footer>NETWORK LAB · 全班共同實驗</footer><script src="/common.js"></script><script src="/play.js"></script></body></html>
